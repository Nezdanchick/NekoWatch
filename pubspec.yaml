name: nekowatch
description: NekoWatch — аниме-приложение (Flutter, Material 3)
publish_to: 'none'
version: 1.0.2+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  http: ^1.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  webview_flutter: ^4.9.0
  cached_network_image: ^3.4.0
  dynamic_color: ^1.7.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
